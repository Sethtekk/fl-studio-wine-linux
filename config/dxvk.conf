# DXVK-Konfiguration für FL Studio
# DXVK 2.7 kompiliert Shader über Graphics Pipeline Libraries ohnehin ohne
# Ruckler; die frühere Option "dxvk.enableAsync" gibt es nur in Forks und
# wird vom offiziellen DXVK ignoriert.

# Anzahl der Threads für die Shader-Kompilierung
dxvk.numCompilerThreads = 4
